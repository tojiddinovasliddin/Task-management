<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register_page</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="box">
    <div class="login">
        <img class="icon" src="/Image/icon.png" alt="">
        <h1>Create an account</h1>
        <form class="inputs">
            <input class="full_name" type="text" placeholder="Full name" required>
            <input class = "email" type="email" placeholder="Email" required>
            <input class = "username" type="text" placeholder="Username" required>
            <input class="password" type="password" placeholder="Password" required>
            <button onclick="btn_signs()" class ="btn_sign">Register</button>
        </form>
     <button class="visit_login">Log In</button>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.js"

    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="index.js"></script>
</body>
</html>
