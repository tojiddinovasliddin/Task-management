<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting page</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="buttons">
        <img class="icon" src="/Image/icon.png" alt="">
        <h2 class="name">Tojiddinov Asliddin</h2>
        <h3 class="email">tojiddinovasliddin830@gmail.com</h3>
        <div class="add">
            <img class="add_image" src="/Image/all.png" alt="">
            <button class="add_task">All tasks</button>
        </div>
        <div class="active">
            <img class="active_img" src="/Image/active.png" alt="">
            <button class="btn_active">Active tasks</button>
        </div>
        <div class="complated">
            <img class="complated_img" src="/Image/complated.png" alt="">
            <button class="btn_complated">Completed tasks</button>
        </div>
        <div class="setting">
            <img class="setting_img" src="/Image/setting.png" alt="">
            <button class="btn_setting">Setting</button>
        </div>
        <div class="login">
            <img class="login_img" src="/Image/logout.png" alt="">
            <button class="log_out"> Log out</button>
        </div>

    </div>
    <div class="change_password">
        <div class="box">
       <h2>Change password</h2>
       <form class="change">
        <input class="username" type="text" placeholder="Username" required>
        <input class="old_password" type="password" placeholder="Old password" required>
        <input class="new_password" type="password" placeholder="New password" required>
        <button class="btn_change">Change</button>
       </form>
        </div>
    </div>


</body>

</html>
